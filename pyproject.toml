[project]
name = "pubquiz-bot-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "8fuhst", email = "github@noahfuhst.de" }
]
requires-python = ">=3.10"
dependencies = [
    "anyio==4.10.0",
    "certifi==2025.8.3",
    "charset-normalizer==3.4.3",
    "exceptiongroup==1.3.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.10",
    "python-dotenv==1.1.1",
    "python-telegram-bot==22.4",
    "pytz>=2026.3.post1",
    "requests==2.32.5",
    "schedule==1.2.2",
    "sniffio==1.3.1",
    "typing-extensions==4.15.0",
    "urllib3==2.5.0",
]

[project.scripts]
pubquiz-bot-python = "pubquiz_bot_python:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
